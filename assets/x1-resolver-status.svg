<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="150" viewBox="0 0 1600 150" role="img" aria-labelledby="title desc"><title id="title">X1 resolver evidence status</title><desc id="desc">Conservative source, test and runtime status for the public resolver repository.</desc><rect width="1600" height="150" fill="#0a0f14"/><path d="M0 0 H1600" stroke="#22d3ee" stroke-width="3"/><g font-family="Arial,Helvetica,sans-serif"><text x="55" y="52" fill="#22d3ee" font-size="18" font-weight="700">VISIBILITY</text><text x="55" y="88" fill="#e8f6ff" font-size="22" font-weight="700">PUBLIC</text><text x="300" y="52" fill="#22d3ee" font-size="18" font-weight="700">PACKAGE</text><text x="300" y="88" fill="#e8f6ff" font-size="22" font-weight="700">PRESENT</text><text x="560" y="52" fill="#22d3ee" font-size="18" font-weight="700">SOURCE</text><text x="560" y="88" fill="#e8f6ff" font-size="22" font-weight="700">OBFUSCATED RELEASE</text><text x="930" y="52" fill="#22d3ee" font-size="18" font-weight="700">TEST</text><text x="930" y="88" fill="#e8f6ff" font-size="22" font-weight="700">NOT PROVEN HERE</text><text x="1250" y="52" fill="#22d3ee" font-size="18" font-weight="700">RUNTIME</text><text x="1250" y="88" fill="#e8f6ff" font-size="22" font-weight="700">NOT VERIFIED</text><text x="55" y="128" fill="#718697" font-size="15" letter-spacing="2">DO NOT TURN README CLAIMS INTO RUNTIME EVIDENCE</text></g></svg>