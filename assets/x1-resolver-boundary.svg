<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="350" viewBox="0 0 1600 350" role="img" aria-labelledby="title desc"><title id="title">X1 resolver usage boundary</title><desc id="desc">Resolver workflow and authorization boundary.</desc><rect width="1600" height="350" fill="#090e13"/><text x="80" y="65" fill="#22d3ee" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700">RESOLVER BOUNDARY</text><rect x="80" y="110" width="430" height="150" fill="#101923" stroke="#24485d"/><rect x="585" y="110" width="430" height="150" fill="#101923" stroke="#24485d"/><rect x="1090" y="110" width="430" height="150" fill="#101923" stroke="#24485d"/><g font-family="Arial,Helvetica,sans-serif"><text x="115" y="155" fill="#eaf7ff" font-size="22" font-weight="700">INPUT</text><text x="115" y="195" fill="#9fb2c3" font-size="18">Authorized HLS source</text><text x="620" y="155" fill="#eaf7ff" font-size="22" font-weight="700">RESOLVE</text><text x="620" y="195" fill="#9fb2c3" font-size="18">Normalize resolver output</text><text x="1125" y="155" fill="#eaf7ff" font-size="22" font-weight="700">OUTPUT</text><text x="1125" y="195" fill="#9fb2c3" font-size="18">Client / panel consumption</text><path d="M510 185 H585 M1015 185 H1090" stroke="#22d3ee" stroke-width="3"/><text x="80" y="310" fill="#718697" font-size="18" letter-spacing="2">USE ONLY WITH CONTENT AND SOURCES YOU ARE AUTHORIZED TO ACCESS AND REDISTRIBUTE</text></g></svg>