<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="420" viewBox="0 0 1600 420" role="img" aria-label="X1 resolver command deck"><defs><linearGradient id="bg" x1="0" x2="1"><stop stop-color="#02060A"/><stop offset="1" stop-color="#071018"/></linearGradient></defs><style>g[font-family] > g > text:nth-of-type(1){font-size:11px;letter-spacing:2px}g[font-family] > g > text:nth-of-type(2){font-size:20px;letter-spacing:0}g[font-family] > g > text:nth-of-type(n+3){font-size:13.5px;letter-spacing:0}</style><rect width="1600" height="420" rx="28" fill="url(#bg)"/><text x="72" y="64" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="700" letter-spacing="5" fill="#6ED8EA">X1 / PUBLIC MEDIA UTILITY</text><text x="72" y="112" font-family="Arial Black,Arial,sans-serif" font-size="38" fill="#F4FCFF">RESOLVE. NORMALIZE. VERIFY OUTPUT.</text><g transform="translate(72 154)" font-family="Arial,Helvetica,sans-serif"><g><rect width="330" height="178" rx="16" fill="#07151D" stroke="#19E8FF"/><text x="24" y="38" font-size="13" font-weight="700" letter-spacing="3" fill="#19E8FF">01 / RECEIVE</text><text x="24" y="77" font-size="23" font-weight="800" fill="#F4FCFF">AUTHORIZED SOURCE</text><text x="24" y="114" font-size="16" fill="#8FB3BF">Operate only on sources</text><text x="24" y="140" font-size="16" fill="#8FB3BF">the operator may use.</text></g><g transform="translate(354 0)"><rect width="330" height="178" rx="16" fill="#09131E" stroke="#326BFF"/><text x="24" y="38" font-size="13" font-weight="700" letter-spacing="3" fill="#7FA0FF">02 / RESOLVE</text><text x="24" y="77" font-size="23" font-weight="800" fill="#F4FCFF">NORMALIZE PATH</text><text x="24" y="114" font-size="16" fill="#8FB3BF">Convert upstream state</text><text x="24" y="140" font-size="16" fill="#8FB3BF">into stable output.</text></g><g transform="translate(708 0)"><rect width="330" height="178" rx="16" fill="#0A111B" stroke="#7B5CFF"/><text x="24" y="38" font-size="13" font-weight="700" letter-spacing="3" fill="#A995FF">03 / DELIVER</text><text x="24" y="77" font-size="23" font-weight="800" fill="#F4FCFF">CONTROLLED OUTPUT</text><text x="24" y="114" font-size="16" fill="#8FB3BF">Expose only required</text><text x="24" y="140" font-size="16" fill="#8FB3BF">integration endpoints.</text></g><g transform="translate(1062 0)"><rect width="330" height="178" rx="16" fill="#07151D" stroke="#19E8FF"/><text x="24" y="38" font-size="13" font-weight="700" letter-spacing="3" fill="#19E8FF">04 / VERIFY</text><text x="24" y="77" font-size="23" font-weight="800" fill="#F4FCFF">RUNTIME RESULT</text><text x="24" y="114" font-size="16" fill="#8FB3BF">Package presence never</text><text x="24" y="140" font-size="16" fill="#8FB3BF">equals runtime proof.</text></g></g><text x="72" y="382" font-family="Arial,Helvetica,sans-serif" font-size="11" letter-spacing="3" fill="#6FBDCB">AUTHORIZED SOURCE → RESOLVE → NORMALIZE → DELIVER → VERIFY</text></svg>